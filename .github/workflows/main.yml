name: Build Game 3D 🎮

on:
  push:
    branches:
      - main

jobs:
  buildWindows:
    name: Build for Windows
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Tao thu muc Build
        run: New-Item -Path "${{ github.workspace }}\build\StandaloneWindows64" -ItemType Directory -Force

      - name: Build Game using Local Unity
        run: |
          & "C:\Program Files\Unity\Hub\Editor\6000.3.22f1\Editor\Unity.exe" -batchmode -quit -projectPath "${{ github.workspace }}" -buildTarget StandaloneWindows64 -executeMethod CIBuilder.BuildGame -logFile -
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Ban-Build-Windows
          path: build/StandaloneWindows64